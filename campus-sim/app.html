<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>캠퍼스 랩 · 웹 실행</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x2='1' y2='1'%3E%3Cstop stop-color='%233b5bdb'/%3E%3Cstop offset='1' stop-color='%237048e8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M27 13 16 8 5 13l11 5 11-5Zm-17 2.5v5c3.5 2.3 8.5 2.3 12 0v-5' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root { --bg: #ffffff; --fg: #1d1d1f; --fg-2: #424245; --muted: #6e6e73; --line: #d2d2d7; --link: #0066cc; --nav: rgba(255, 255, 255, .8); }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --fg: #f5f5f7; --fg-2: #d2d2d7; --muted: #a1a1a6; --line: #38383c; --link: #2997ff; --nav: rgba(22, 22, 23, .8); }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased;
      font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
    /* 소개 페이지와 같은 얇고 반투명한 위쪽 막대 */
    .bar { display: flex; align-items: center; gap: 20px; height: 48px; padding: 0 16px; background: var(--nav);
      backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--line); font-size: 13px; }
    .bar .brand { display: flex; align-items: center; gap: 8px; color: var(--fg); font-weight: 700; font-size: 15px; text-decoration: none; }
    .bar .logo { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 13px;
      background: linear-gradient(135deg, #3b5bdb, #7048e8); }
    .bar .note { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar button { color: var(--link); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; white-space: nowrap; }
    .bar button:hover { text-decoration: underline; }
    .bar :focus-visible { outline: 2px solid #0071e3; outline-offset: 3px; border-radius: 6px; }
    @media (max-width: 640px) { .bar .note { display: none; } .bar button { margin-left: auto; } }
    /* 앱의 사이드바 · 머리줄(화면 고정 요소)이 위쪽 막대를 덮지 않도록 이 영역 안에서만 배치되게 합니다 */
    #root { position: relative; height: calc(100% - 49px); overflow: hidden; transform: translateZ(0); }
  </style>
</head>
<body>
  <div class="bar">
    <a class="brand" href="./"><span class="logo" aria-hidden="true">🎓</span>캠퍼스 랩</a>
    <span class="note">기록은 이 브라우저에만 저장됩니다 · 웹 버전은 AI 보정 없이 계산식으로 동작</span>
    <button type="button" id="download">내 기록 CSV 내려받기</button>
  </div>
  <div id="root"></div>

  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";

    // 저장소에 있는 원본 코드를 그대로 불러와 실행합니다(코드를 복사해 두지 않습니다).
    const source = (path) => ({ url: new URL(path, location.href).href });
    const LOG = "/home/pyodide/data/simulation_log.csv";

    const app = mount(
      {
        entrypoint: "app.py",
        files: {
          "app.py": source("app.py"),
          "modules/compare.py": source("modules/compare.py"),
          "modules/counsel.py": source("modules/counsel.py"),
          "modules/feedback.py": source("modules/feedback.py"),
          "modules/profile.py": source("modules/profile.py"),
          "modules/report.py": source("modules/report.py"),
          "modules/scenario.py": source("modules/scenario.py"),
          "modules/simulation.py": source("modules/simulation.py"),
          "modules/ui.py": source("modules/ui.py"),
        },
        requirements: [],
        // data 폴더를 브라우저 저장소(IndexedDB)에 연결해 새로고침해도 기록이 남게 합니다.
        idbfsMountpoints: ["/home/pyodide/data"],
        // .streamlit/config.toml과 같은 테마 (stlite는 값으로 문자열 · 숫자 · 참/거짓만 받습니다. 배열과 "이름:주소" 형식 글꼴은 넣지 마세요)
        streamlitConfig: {
          "client.toolbarMode": "viewer",
          "theme.base": "light",
          "theme.primaryColor": "#0071e3",
          "theme.backgroundColor": "#ffffff",
          "theme.secondaryBackgroundColor": "#f5f5f7",
          "theme.textColor": "#1d1d1f",
          "theme.borderColor": "#d2d2d7",
          "theme.linkColor": "#0066cc",
          "theme.font": "Pretendard Variable, Pretendard, sans-serif",
          "theme.headingFontWeights": 700,
          "theme.baseRadius": "14px",
          "theme.buttonRadius": "999px",
          "theme.showWidgetBorder": true,
          "theme.dataframeHeaderBackgroundColor": "#f5f5f7",
          "theme.sidebar.backgroundColor": "#f5f5f7",
          "theme.sidebar.secondaryBackgroundColor": "#ffffff",
          "theme.sidebar.textColor": "#1d1d1f",
          "theme.sidebar.primaryColor": "#0071e3",
          "theme.sidebar.borderColor": "#d2d2d7",
        },
      },
      document.getElementById("root"),
    );

    document.getElementById("download").addEventListener("click", async () => {
      let text;
      try {
        text = await app.readFile(LOG, { encoding: "utf8" });
      } catch {
        alert("아직 저장된 기록이 없습니다. 선택지를 먼저 입력하세요.");
        return;
      }
      const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "simulation_log.csv";
      link.click();
      URL.revokeObjectURL(link.href);
    });

    // 기록은 stlite가 화면을 다시 그릴 때마다 브라우저 저장소(IndexedDB)에 자동으로 저장합니다.

  </script>
</body>
</html>
